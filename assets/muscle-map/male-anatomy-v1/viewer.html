<script>
(()=>{const root=document.getElementById('cresum-mask-review');const groups=[{"id":"chest","label":"Грудь","views":["front"]},{"id":"upper-back","label":"Верх спины","views":["back"]},{"id":"lats","label":"Широчайшие","views":["back"]},{"id":"traps","label":"Трапеции","views":["back"]},{"id":"front-delts","label":"Передние дельты","views":["front"]},{"id":"side-delts","label":"Средние дельты","views":["front","back"]},{"id":"rear-delts","label":"Задние дельты","views":["back"]},{"id":"biceps","label":"Бицепсы","views":["front"]},{"id":"triceps","label":"Трицепсы","views":["back"]},{"id":"forearms","label":"Предплечья","views":["front","back"]},{"id":"abs","label":"Пресс и косые","views":["front"]},{"id":"lower-back","label":"Поясница","views":["back"]},{"id":"glutes","label":"Ягодицы","views":["back"]},{"id":"quadriceps","label":"Квадрицепсы","views":["front"]},{"id":"hamstrings","label":"Задняя поверхность бедра","views":["back"]},{"id":"calves","label":"Икры","views":["back"]},{"id":"adductors","label":"Приводящие мышцы","views":["front"]}];const views={"front":{"viewBox":[40,0,616,1199],"mirrorAxis":368},"back":{"viewBox":[656,0,616,1199],"mirrorAxis":939}};const select=root.querySelector('select');let mode='selected',view='both';
function draw(){root.querySelectorAll('[data-layer]').forEach(layer=>{layer.style.display=mode==='none'||mode==='selected'&&layer.dataset.layer!==select.value?'none':'';layer.setAttribute('opacity',root.querySelector('input').value)});root.querySelector('svg').setAttribute('viewBox',view==='both'?'0 0 1312 1199':views[view].viewBox.join(' '));root.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));root.querySelectorAll('button[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===view)));const group=groups.find(g=>g.id===select.value);root.querySelector('[data-status]').textContent=group.label+' · '+group.id+' · '+(select.selectedIndex+1)+' / '+groups.length+(view!=='both'&&!group.views.includes(view)?' · Слой доступен в другом ракурсе':'');}
select.addEventListener('change',draw);root.querySelector('input').addEventListener('input',draw);root.querySelectorAll('[data-step]').forEach(button=>button.addEventListener('click',()=>{select.selectedIndex=(select.selectedIndex+Number(button.dataset.step)+groups.length)%groups.length;draw()}));root.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;draw()}));root.querySelectorAll('button[data-view]').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;draw()}));draw();})();
