<div id="cresum-abs-position-review">
  <style>
    #cresum-abs-position-review {
      display: grid;
      gap: 12px;
      color: var(--foreground);
    }
    #cresum-abs-position-review .figure {
      display: flex;
      justify-content: center;
    }
    #cresum-abs-position-review svg {
      display: block;
      width: 100%;
      max-width: 440px;
      height: auto;
    }
    #cresum-abs-position-review svg.phone {
      max-width: 260px;
    }
    #cresum-abs-position-review .muscle-fill {
      fill: var(--red);
    }
    #cresum-abs-position-review .unassigned-fill {
      fill: var(--orange);
    }
    #cresum-abs-position-review .muscle-outline {
      fill: none;
      stroke: var(--red);
      stroke-width: 1.2px;
      vector-effect: non-scaling-stroke;
    }
  </style>
  <div class="viz-controls">
    <label class="form-label"
      >Участок живота
      <select class="form-select" data-structure>
        <option value="all">Все участки</option>
        <option value="rectus-abdominis-upper">Прямая · верхний сегмент</option>
        <option value="rectus-abdominis-middle-upper">
          Прямая · средний верхний
        </option>
        <option value="rectus-abdominis-middle-lower">
          Прямая · средний нижний
        </option>
        <option value="rectus-abdominis-lower">Прямая · нижний сегмент</option>
        <option value="external-oblique">Наружная косая</option>
      </select>
    </label>
    <label class="form-label"
      >Сторона персонажа
      <select class="form-select" data-side>
        <option value="both">Обе</option>
        <option value="left">Левая · справа на изображении</option>
        <option value="right">Правая · слева на изображении</option>
      </select>
    </label>
  </div>
  <div class="viz-row" role="group" aria-label="Отображение мышц живота">
    <button class="btn" type="button" data-mode="fill" aria-pressed="true">
      Подсветка
    </button>
    <button class="btn" type="button" data-mode="outline" aria-pressed="false">
      Границы
    </button>
    <button class="btn" type="button" data-mode="source" aria-pressed="false">
      Оригинал
    </button>
  </div>
  <div class="text-small" aria-live="polite" data-status>
    Выберите часть для настройки её левой и правой масок.
  </div>
  <div class="viz-controls">
    <label class="form-label"
      >Край левой: <span data-left-value>0 px</span>
      <input
        class="form-range"
        data-left
        aria-label="Сужение левой маски выбранной мышцы"
        type="range"
        min="-3"
        max="6"
        step="0.5"
        value="0"
        disabled
      />
    </label>
    <label class="form-label"
      >Край правой: <span data-right-value>0 px</span>
      <input
        class="form-range"
        data-right
        aria-label="Сужение правой маски выбранной мышцы"
        type="range"
        min="-3"
        max="6"
        step="0.5"
        value="0"
        disabled
      />
    </label>
  </div>
  <div class="text-small">− расширить · + сузить · шаг 0,5 px исходника</div>
  <div class="viz-controls">
    <label class="form-label"
      >Левая к центру: <span data-shift-left-value>0 px</span>
      <input
        class="form-range"
        data-shift-left
        aria-label="Сдвиг левой маски к центру"
        type="range"
        min="-5"
        max="5"
        step="0.5"
        value="0"
        disabled
      />
    </label>
    <label class="form-label"
      >Правая к центру: <span data-shift-right-value>0 px</span>
      <input
        class="form-range"
        data-shift-right
        aria-label="Сдвиг правой маски к центру"
        type="range"
        min="-5"
        max="5"
        step="0.5"
        value="0"
        disabled
      />
    </label>
  </div>
  <div class="viz-controls">
    <label class="form-label"
      >Левая вверх / вниз: <span data-shift-y-left-value>0 px</span>
      <input
        class="form-range"
        data-shift-y-left
        aria-label="Вертикальный сдвиг левой маски"
        type="range"
        min="-10"
        max="10"
        step="0.5"
        value="0"
        disabled
      />
    </label>
    <label class="form-label"
      >Правая вверх / вниз: <span data-shift-y-right-value>0 px</span>
      <input
        class="form-range"
        data-shift-y-right
        aria-label="Вертикальный сдвиг правой маски"
        type="range"
        min="-10"
        max="10"
        step="0.5"
        value="0"
        disabled
      />
    </label>
  </div>
  <div class="text-small">− вверх · + вниз · шаг 0,5 px исходника</div>
  <div class="viz-controls">
    <label class="form-label"
      >Масштаб
      <select class="form-select" data-zoom>
        <option value="detail">Живот крупно</option>
        <option value="phone">Полный рост</option>
      </select>
    </label>
    <label class="form-label"
      >Насыщенность предпросмотра: <span data-opacity-value>65%</span>
      <input
        class="form-range"
        data-opacity
        aria-label="Насыщенность только для проверки масок"
        type="range"
        min="0"
        max="1"
        step="0.05"
        value="0.65"
      />
    </label>
  </div>
  <div class="figure">
    <svg
      viewBox="260 305 215 215"
      role="img"
      aria-label="Восемь сегментов прямой мышцы живота и две наружные косые; черновые контуры"

  </script>
  <script type="application/json" data-settings>
    "__ABS_SETTINGS_JSON__"
  </script>
  <script>
    (() => {
      const root = document.getElementById('cresum-abs-position-review');
      const regions = JSON.parse(
        root.querySelector('[data-geometry]').textContent,
      );
      const settings = JSON.parse(
        root.querySelector('[data-settings]').textContent,
      );
      const controls = {
        left: root.querySelector('[data-left]'),
        right: root.querySelector('[data-right]'),
      };
      const shifts = {
        left: root.querySelector('[data-shift-left]'),
        right: root.querySelector('[data-shift-right]'),
      };
      const vertical = {
        left: root.querySelector('[data-shift-y-left]'),
        right: root.querySelector('[data-shift-y-right]'),
      };
      const structure = root.querySelector('[data-structure]'),
        side = root.querySelector('[data-side]'),
        zoom = root.querySelector('[data-zoom]'),
        opacity = root.querySelector('[data-opacity]');
      const svg = root.querySelector('svg'),
        layer = root.querySelector('[data-masks]');
      let mode = 'fill';
      function draw() {
        const all = structure.value === 'all';
        layer.replaceChildren();
        layer.setAttribute('opacity', mode === 'outline' ? '1' : opacity.value);
        layer.style.mixBlendMode = mode === 'fill' ? 'multiply' : 'normal';
        for (const name of ['left', 'right']) {
          controls[name].disabled = all;
          shifts[name].disabled = all;
          vertical[name].disabled = all;
          root.querySelector('[data-' + name + '-value]').textContent = all
            ? '—'
            : controls[name].value + ' px';
          root.querySelector('[data-shift-' + name + '-value]').textContent =
            all ? '—' : shifts[name].value + ' px';
          root.querySelector('[data-shift-y-' + name + '-value]').textContent =
            all ? '—' : vertical[name].value + ' px';
        }
        if (mode !== 'source')
          for (const region of regions) {
            if (!all && region.structureId !== structure.value) continue;
            if (all && !region.muscleGroupId) continue;
            if (side.value !== 'both' && region.side !== side.value) continue;
            const state = settings[region.id],
              path = document.createElementNS(
                'http://www.w3.org/2000/svg',
                'path',
              );
            path.setAttribute(
              'd',
              region.variants.find((v) => v.radius === state.inset).path,
            );
            path.setAttribute('data-region', region.id);
            path.setAttribute('data-side', region.side);
            path.setAttribute('data-structure', region.structureId);
            path.setAttribute(
              'transform',
              'translate(' +
                state.shift * (region.side === 'left' ? -1 : 1) +
                ' ' +
                state.shiftY +
                ')',
            );
            path.setAttribute(
              'class',
              mode === 'outline'
                ? 'muscle-outline'
                : region.muscleGroupId
                  ? 'muscle-fill'
                  : 'unassigned-fill',
            );
            path.setAttribute('opacity', '1');
            layer.append(path);
          }
        svg.setAttribute(
          'viewBox',
          zoom.value === 'phone'
            ? '0 0 656 1199'
            : side.value === 'left'
              ? '365 305 110 215'
              : side.value === 'right'
                ? '260 305 110 215'
                : '260 305 215 215',
        );
        svg.classList.toggle('phone', zoom.value === 'phone');
        root.querySelector('[data-opacity-value]').textContent =
          Math.round(Number(opacity.value) * 100) + '%';
        root.querySelector('[data-status]').textContent = all
          ? '10 черновых участков · выберите участок для настройки.'
          : structure.selectedOptions[0].textContent +
            ' · границы для проверки.';
        root
          .querySelectorAll('[data-mode]')
          .forEach((b) =>
            b.setAttribute('aria-pressed', String(b.dataset.mode === mode)),
          );
      }
      for (const name of ['left', 'right']) {
        function save() {
          const r = regions.find(
            (r) => r.side === name && r.structureId === structure.value,
          );
          if (!r) return;
          settings[r.id] = {
            inset: Number(controls[name].value),
            shift: Number(shifts[name].value),
            shiftY: Number(vertical[name].value),
          };
          draw();
        }
        controls[name].addEventListener('input', save);
        shifts[name].addEventListener('input', save);
        vertical[name].addEventListener('input', save);
      }
      structure.addEventListener('change', () => {
        for (const name of ['left', 'right']) {
          const r = regions.find(
            (r) => r.side === name && r.structureId === structure.value,
          );
          controls[name].value = r ? settings[r.id].inset : 0;
          shifts[name].value = r ? settings[r.id].shift : 0;
          vertical[name].value = r ? settings[r.id].shiftY : 0;
        }
        draw();
      });
      [side, zoom].forEach((c) => c.addEventListener('change', draw));
      opacity.addEventListener('input', draw);
      root.querySelectorAll('[data-mode]').forEach((b) =>
        b.addEventListener('click', () => {
          mode = b.dataset.mode;
          draw();
        }),
      );
      draw();
    })();
  </script>
</div>
