name: CI

on:
  push:
    branches: [main, develop, feature/workout-engine]
  pull_request:
    branches: [main, develop, feature/github-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify schema and owner isolation
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          {
            cat supabase/tests/bootstrap.sql
            for migration in supabase/migrations/*.sql; do
              cat "$migration"
              case "$migration" in
                *_cloud_sync_foundation.sql) cat supabase/tests/cloud-foundation.sql ;;
                *_history_sync_protocol.sql) cat supabase/tests/history-sync.sql ;;
                *_history_conflict_resolution.sql) cat supabase/tests/history-conflicts.sql ;;
              esac
            done
          } | docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d postgres --set ON_ERROR_STOP=on
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run export:check
